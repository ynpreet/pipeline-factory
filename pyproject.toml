[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-factory"
version = "0.1.0"
description = "An AI-assisted software factory: backlog ticket -> governed data pipeline, with review, verification, and a human approval gate."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factory = "pipeline_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
